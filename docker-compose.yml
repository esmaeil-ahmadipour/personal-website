version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tarvix-postgres
    environment:
      POSTGRES_USER: tarvix
      POSTGRES_PASSWORD: tarvix123
      POSTGRES_DB: tarvix_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarvix -d tarvix_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
