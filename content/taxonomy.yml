# content/taxonomy.yml
#
# Categories and tags of the site, in one file. This file is the source of truth: the
# importer creates or updates rows in the database from it (see docs/content-import.md).
#
# categories[]  slug (required, unique), order (default 0), isActive (default true),
#               locales.en / locales.fa (required), locales.ar (optional);
#               each locale has name (required) and description (optional).
# tags[]        slug (required, unique), color (hex, default #3b82f6), icon (optional),
#               locales.en / locales.fa (required), locales.ar (optional); each has name.
#
# Posts refer to these by slug (post.yml: category, tags). Unknown keys are errors.

categories:
